name: CD Pipeline - Deploy to Production

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Allow manual triggering

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: library-website
  REGION: us-central1

jobs:
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
                       -t gcr.io/$PROJECT_ID/$SERVICE_NAME:latest .

      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 10 \
            --port 3000 \
            --set-env-vars NODE_ENV=production

      - name: Get Cloud Run URL
        id: get-url
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)')
          echo "service_url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Wait for deployment to stabilize
        run: sleep 10

      - name: Health Check
        run: |
          HEALTH_URL="${{ steps.get-url.outputs.service_url }}/api/health"
          echo "Checking health endpoint: $HEALTH_URL"
          
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL)
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              curl -s $HEALTH_URL | jq '.'
              exit 0
            else
              echo "⚠️  Health check failed (HTTP $HTTP_CODE). Retrying in 5s... ($((RETRY_COUNT + 1))/$MAX_RETRIES)"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 5
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Production Smoke Tests
        run: |
          BASE_URL="${{ steps.get-url.outputs.service_url }}"
          
          echo "Running smoke tests against: $BASE_URL"
          
          # Test 1: Homepage loads
          echo "Test 1: Homepage"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $BASE_URL)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Homepage test failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ Homepage test passed"
          
          # Test 2: API endpoint accessible
          echo "Test 2: Articles API"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $BASE_URL/api/articles)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ API test failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ API test passed"
          
          echo "All smoke tests passed! 🎉"

      - name: View Cloud Run Logs
        if: always()
        run: |
          echo "Recent deployment logs:"
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE_NAME" \
            --limit 50 \
            --format json

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: $SERVICE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: $REGION" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.get-url.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Check Endpoint" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.get-url.outputs.service_url }}/api/health" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back to previous version..."
          gcloud run services update-traffic $SERVICE_NAME \
            --region $REGION \
            --to-revisions LATEST=0,PREVIOUS=100 || true
