name: CD - Ansible Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes --update ppa:ansible/ansible
          sudo apt-get install -y ansible

      - name: Verify Ansible installation
        run: ansible --version

      - name: Create inventory file
        run: |
          cat > ansible/inventory.ini << EOF
          [production]
          production-server ansible_host=${{ secrets.SERVER_IP }} ansible_user=${{ secrets.SERVER_USER || 'ubuntu' }} ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Test connection to server
        run: |
          ansible -i ansible/inventory.ini production -m ping

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbooks/deploy.yml -v
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.SERVER_IP }}/api/health || curl -f http://${{ secrets.SERVER_IP }}/ || echo "Health check failed, but deployment may still be successful"

      - name: Deployment summary
        run: |
          echo "### Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** ${{ secrets.SERVER_IP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** production" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Application should be accessible at: http://${{ secrets.SERVER_IP }}" >> $GITHUB_STEP_SUMMARY
